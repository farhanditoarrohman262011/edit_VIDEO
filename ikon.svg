<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- badan squircle: gradasi indigo → cyan (aksen website) -->
    <linearGradient id="badan" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7c86ff"/>
      <stop offset="0.55" stop-color="#4f63e6"/>
      <stop offset="1" stop-color="#1fb6d6"/>
    </linearGradient>
    <radialGradient id="sorot" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tepi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <!-- simbol timbul: muka terang + sisi gelap -->
    <linearGradient id="muka" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f6ff"/>
    </linearGradient>
    <linearGradient id="sisi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3bb0"/>
      <stop offset="1" stop-color="#0e6d8a"/>
    </linearGradient>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#0b1240" flood-opacity="0.55"/>
    </filter>
    <filter id="bayangKecil" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#06103a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#bayang)">
    <rect x="92" y="80" width="840" height="840" rx="210" fill="url(#badan)"/>
    <rect x="92" y="80" width="840" height="840" rx="210" fill="url(#sorot)"/>
    <rect x="96" y="84" width="832" height="832" rx="206" fill="none" stroke="url(#tepi)" stroke-width="8"/>
  </g>
  <!-- bingkai 9:16 timbul (sisi lalu muka) -->
  <g filter="url(#bayangKecil)">
    <rect x="352" y="232" width="320" height="560" rx="64" fill="url(#sisi)" transform="translate(16 22)"/>
    <rect x="352" y="232" width="320" height="560" rx="64" fill="url(#muka)"/>
    <rect x="384" y="268" width="256" height="488" rx="40" fill="#141a3a"/>
    <!-- tombol putar cyan dengan kilau -->
    <path d="M478 430 L600 512 L478 594 Z" fill="#22d3ee"/>
    <path d="M478 430 L600 512 L560 512 Z" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- penanda potong (klip) di sisi -->
  <g filter="url(#bayangKecil)">
    <rect x="232" y="350" width="150" height="34" rx="17" fill="#ffffff"/>
    <rect x="642" y="640" width="150" height="34" rx="17" fill="#ffffff"/>
  </g>
  <ellipse cx="420" cy="200" rx="220" ry="60" fill="#ffffff" opacity="0.12"/>
</svg>
